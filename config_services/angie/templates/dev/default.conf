#===== Upstreams =====
upstream backend {
    server host.docker.internal:{{.Env.BACKEND_PORT}} max_fails=0;
}

upstream frontend {
    server host.docker.internal:{{.Env.FRONTEND_PORT}} max_fails=0;
}

upstream airflow {
    server airflow-apiserver:{{.Env.AIRFLOW_WWW_PORT}} max_fails=0;
}

upstream thumbor {
    server thumbor:{{.Env.THUMBOR_PORT}} max_fails=0;
}

upstream minio {
    server minio:{{.Env.MINIO_PORT}} max_fails=0;
}

upstream minio_console {
    server minio:{{.Env.MINIO_CONSOLE_PORT}} max_fails=0;
}

upstream rabbitmq_console {
    server rabbitmq:{{.Env.RABBITMQ_CONSOLE_PORT}} max_fails=0;
}

#===== Log formats =====
log_format upstream_time '$remote_addr - $remote_user [$time_local] '
                         '$request_id "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt="$request_time" uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

#===== Servers =====

# backend
server {
    listen 80;
    access_log /var/log/angie/backend_access.log upstream_time;
    error_log /var/log/angie/backend_error.log debug;

    add_header X-Request-ID $request_id;
    client_max_body_size 0;

    server_name api.{{.Env.PROJECT_DOMAIN}};

    # Загруженные файлы
    location /media/ {
        alias /app-backend/media/;
    }

    # Статические файлы API
    location ~ ^/api/(v\d)/static/(.*)$ {
        alias /app-backend/static/$2;
    }

    # Запросы API
    location / {
        include proxy_params;
        proxy_pass http://backend;
    }
}

# frontend
server {
    listen 80;
    access_log /var/log/angie/frontend_access.log upstream_time;
    error_log /var/log/angie/frontend_error.log debug;

    add_header X-Request-ID $request_id;

    server_name {{.Env.PROJECT_DOMAIN}};

    location / {
        include proxy_params;
        proxy_pass http://frontend;
    }
}

# airflow
server {
    listen 80;
    access_log /var/log/angie/airflow_access.log upstream_time;
    error_log /var/log/angie/airflow_error.log debug;

    server_name airflow.{{.Env.PROJECT_DOMAIN}};

    location / {
        include proxy_params;
        include proxy_websocket_params;
        proxy_pass http://airflow;
    }
}

# rabbitmq-console
server {
    listen 80;
    access_log /var/log/angie/rabbitmq_console_access.log upstream_time;
    error_log /var/log/angie/rabbitmq_console_error.log debug;

    server_name rabbitmq-console.{{.Env.PROJECT_DOMAIN}};

    location / {
        include proxy_params;
        proxy_pass http://rabbitmq_console;
    }
}

# minio
server {
    listen 80;
    access_log /var/log/angie/minio_access.log upstream_time;
    error_log /var/log/angie/minio_error.log debug;

    server_name minio.{{.Env.PROJECT_DOMAIN}};

    # To allow special characters in headers
    ignore_invalid_headers off;
    # Allow any size file to be uploaded.
    # Set to a value such as 1000m; to restrict file size to a specific value
    client_max_body_size 0;
    # To disable buffering
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        include proxy_params;

        proxy_connect_timeout 300;
        # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_pass http://minio;
    }
}

# minio-console
server {
    listen 80;
    access_log /var/log/angie/minio_console_access.log upstream_time;
    error_log /var/log/angie/minio_console_error.log debug;

    server_name minio-console.{{.Env.PROJECT_DOMAIN}};

    # To allow special characters in headers
    ignore_invalid_headers off;
    # Allow any size file to be uploaded.
    # Set to a value such as 1000m; to restrict file size to a specific value
    client_max_body_size 0;
    # To disable buffering
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        include proxy_params;
        proxy_set_header X-NginX-Proxy true;

        # This is necessary to pass the correct IP to be hashed
        real_ip_header X-Real-IP;

        proxy_connect_timeout 300;

        # To support websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        chunked_transfer_encoding off;

        proxy_pass http://minio_console;
    }
}

# thumbor
server {
    listen 80;
    access_log /var/log/angie/thumbor_access.log upstream_time;
    error_log /var/log/angie/thumbor_error.log debug;

    server_name img-cdn.{{.Env.PROJECT_DOMAIN}};

    location / {
        include proxy_params;
        proxy_pass http://thumbor;
    }
}
