<div class="overflow-auto">
    <table
            class="table table-hover data-sortable"
            data-sort-col="{{ order }}"
            data-sort-direction="{{ direction }}"
    >
        <thead>
        <tr>
            {% for column in columns %}
                <th {% if column.is_sorted %}role="button" data-sort-col="{{ column.field }}"{% endif %}>
                    {{ column.title }}
                </th>
            {% endfor %}
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        {% for item in items %}
            <tr>
                {% for column in columns %}
                    <td>
                        {% include "page/common/blocks/_column.html" %}
                    </td>
                {% endfor %}
                <td>
                    <a
                            href="{{ url_for(view_url, entity_id=item.id, **view_url_params) }}"
                            class="btn btn-sm btn-info"
                            title="{{ titles.buttons.button_view }}"
                    >
                        <i class="bi bi-search"></i>
                    </a>

                    {% if is_updated %}
                    <a
                            href="{{ url_for(update_url, entity_id=item.id) }}"
                            class="btn btn-sm btn-success ms-1"
                            title="{{ titles.buttons.button_update }}"
                    >
                        <i class="bi bi-pencil"></i>
                    </a>
                    {% endif %}

                    {% if is_deleted %}
                    <a
                            href="{{ url_for(view_delete_url, entity_id=item.id) }}"
                            class="btn btn-sm btn-danger ms-1"
                            title="{{ titles.buttons.button_delete }}"
                    >
                        <i class="bi bi-trash"></i>
                    </a>
                    {% endif %}
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
